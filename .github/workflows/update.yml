name: Update ACEStream Data

on:
  schedule:
    # Cada 12 horas: 0,12 */3 * * *
    - cron: '0 */12 * * *'
  workflow_dispatch:  # Permite запускать вручную
  push:
    branches: [master]

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py

      - name: Check changes
        id: changed
        run: |
          if git diff --exit-code events.json channels.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No hay cambios, skipping commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push changes
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add events.json channels.json
          git commit -m "data: auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
